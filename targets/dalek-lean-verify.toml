# Target config for curve25519-dalek-lean-verify (DESIGN.md §3.5).
# The [lean] and [protected] sections are read by the gate; [agent] and [budget] by the pipeline.

name = "dalek-lean-verify"
github = "Beneficial-AI-Foundation/curve25519-dalek-lean-verify"

[lean]
# Modules `lake build` must build (the required targets, G3), and the roots of the audited
# module inventory: every project module they import, except extracted code, is frozen (§4.2).
build_targets = ["Curve25519Dalek"]
root_modules = ["Curve25519Dalek"]
source_roots = ["Curve25519Dalek/"]
lean_num_threads = 8

[protected]
# Files the candidate diff may not touch at all (§4.2).
extracted = ["Curve25519Dalek/Funs.lean", "Curve25519Dalek/Types.lean"]
trusted_models = ["Curve25519Dalek/FunsExternal.lean", "Curve25519Dalek/TypesExternal.lean"]
build_config = ["lakefile.toml", "lakefile.lean", "lean-toolchain", "lake-manifest.json",
                "aeneas-config.yml", "functions.json", ".github/"]

[agent]
adapter = "claude-code"
model = "claude-opus-5-5"
# Tool profile (DESIGN.md §7.3): "minimal" needs tool calling; "lsp" also Lean language-server tools.
# An adapter that cannot meet it refuses to start.
tool_profile = "lsp"

[budget]
# Prototype caps. Defaults are to be set from pilot runs (§3.3 S4, §8.5); these are guesses.
# Minutes mean the same for every agent and model; turns do not (Claude Code counts model API
# calls, Codex completed agent messages). per_run_minutes is one deadline for the whole run
# (preparation, attempts, builds, gate). The dollar caps apply only to models with a price entry
# below; they are best effort until the metering proxy exists (§9.5, SCI-1717). [budget.<adapter>]
# overrides these for one agent adapter; false turns a cap off. An adapter that cannot enforce a
# cap left on refuses to start without --allow-unenforced-caps.
per_theorem_usd = 5.0
per_theorem_minutes = 25
per_theorem_turns = 80
per_run_usd = 20.0
per_run_minutes = 120
# Attempts per theorem: 1 patches the old proof; later ones start fresh, told why the last failed.
attempts_per_theorem = 2

[budget.codex]
# Codex CLI cannot stop a session at a turn count or a dollar amount, so its theorems are capped by
# time; dollars are checked only between attempts, against per_run_usd.
per_theorem_turns = false
per_theorem_usd = false

[repair]
# The no-model sweep (§3.3 S4) before any agent: leftover tactics, timeouts, unsolved goals.
sweep = true

[live]
# The silent live workflow (.github/workflows/live.yml, shfv/live.py): open PRs whose Lean check
# failed on the head, if the extraction check passed on the same head (S1). Check names as the
# repo's CI reports them. A dalek run needs the 8-core larger runner (docs/ACTIONS.md, run 1).
enabled = true
lean_check = "Build Lean Project"
extraction_check = "Check Aeneas Extraction"
runner = "self-healing-fv"

# USD per million tokens, used to compute cost from token counts for every adapter.
# Anthropic first-party list prices from https://platform.claude.com/docs/en/about-claude/pricing
# (read 2026-10-26). They reproduce Claude Code's own reported cost exactly on the 2026-10-23 pilot
# runs (Opus 5.5 and Sonnet 5.5). Claude Haiku 5.5 is priced per request by prompt length (over
# 100K tokens costs more), which session totals cannot resolve, so it is left out: its cost is
# reported as unknown. Add a model here before relying on its dollar cap.
[prices."claude-opus-5-5"]
input = 4.0
output = 20.0
cache_read = 0.20
cache_write_5m = 5.0
cache_write_1h = 8.0

[prices."claude-sonnet-5-5"]
input = 2.0
output = 10.0
cache_read = 0.10
cache_write_5m = 2.50
cache_write_1h = 4.0

[prices."claude-fable-5-1"]
input = 10.0
output = 50.0
cache_read = 0.25
cache_write_5m = 12.50
cache_write_1h = 20.0

# OpenAI Standard-tier list prices for GPT-6.1 Sol (Codex), from
# https://developers.openai.com/api/docs/pricing and https://developers.openai.com/api/docs/models/gpt-6.1-sol
# (read 2026-10-28). Prompts of at most 272K input tokens cost $2 input, $0.10 cached input,
# $10 output, $2.50 / $5.00 cache writes (30 minutes / 12 hours); a request whose prompt is
# longer costs 2x input and cache and 1.5x output for the whole request. Codex reports usage per
# turn, summed over many requests (115K to 2.3M input tokens per turn so far), so it cannot tell
# which tier each request was in. These are the long-prompt rates for every token: an upper bound
# (`upper_bound`; the report says "at most"), so the dollar cap is never undercounted. The cache
# write fields hold OpenAI's 30-minute and 12-hour tiers; Codex reports writes without a duration,
# so they are priced as 12-hour writes.
[prices."gpt-6.1-sol"]
input = 4.0
output = 15.0
cache_read = 0.20
cache_write_5m = 5.0
cache_write_1h = 10.0
upper_bound = true
