[project]
name = "self-healing-fv"
version = "0.0.1"
description = "Self-healing CI for verified Rust (Rust → Charon/Aeneas → Lean): proof repair behind a mechanical gate"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
shfv = "shfv.cli:main"
gate = "gates.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gates", "shfv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
