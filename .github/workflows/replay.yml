# Replay one historical case on a GitHub-hosted runner and upload the run record (SCI-1717).
# The prototype's deployment step (DESIGN.md §2.3, §9): manual dispatch, or called by live.yml for
# one live change (base and head of a target repo, §3.6). It never runs on pull requests, posts
# nothing, and holds no GitHub write token. How to dispatch: docs/ACTIONS.md.
name: replay

on:
  workflow_dispatch:
    inputs:
      case:
        description: "Case id, <repo>/<sha8> as in data/replay/"
        required: true
        default: dalek-lean-verify/e65b46d0
      agent:
        description: "Run the agent (uses the ANTHROPIC_API_KEY secret). Off: the no-model sweep only, no key"
        type: boolean
        default: false
      model:
        description: "Model (empty: the target config's default)"
        required: false
        default: ""
      per_run_usd:
        description: "Per-run cost cap, USD (API-equivalent, from token counts)"
        required: true
        default: "15"
      per_run_minutes:
        description: "Per-run deadline, minutes (preparation, attempts, builds, gate)"
        required: true
        default: "300"
      runner:
        description: "Runner label"
        required: true
        default: ubuntu-latest
      upload_transcripts:
        description: "Also upload the agent's raw transcripts (anyone can download a public repo's artifacts)"
        type: boolean
        default: false
  # Live input, from live.yml: one change of a target repo, picked there (shfv live-select).
  workflow_call:
    inputs:
      target: {type: string, required: true, description: "Target config name (targets/<target>.toml)"}
      base: {type: string, required: true, description: "Base commit SHA (the run uses its merge-base with head)"}
      head: {type: string, required: true, description: "Head commit SHA"}
      fetch_ref: {type: string, required: true, description: "What to fetch for the head, e.g. refs/pull/<n>/head"}
      pr: {type: string, default: "", description: "Pull request number, if any"}
      title: {type: string, default: "", description: "Pull request title, or what the change is"}
      artifact: {type: string, required: true, description: "Name of the run-record artifact"}
      agent: {type: boolean, default: true}
      model: {type: string, default: ""}
      per_run_usd: {type: string, default: "15"}
      per_run_minutes: {type: string, default: "300"}
      runner: {type: string, default: self-healing-fv}
      # From pr-repair.yml, which a target repo calls on its own PRs (the run is then the target's):
      repo: {type: string, default: "", description: "Clone this repo (owner/name) instead of the target config's, e.g. a private copy"}
      record: {type: string, default: full, description: "full: the whole run record; reports: report.json, report.md and the patch, no prompts or transcripts (for a public target's artifacts)"}
      save_store: {type: boolean, default: true, description: "Save the replay store cache (off in a target repo: its cache is the target's own)"}
      upload_transcripts: {type: boolean, default: false, description: "With record: full, also upload the agent's raw transcripts"}
    secrets:
      ANTHROPIC_API_KEY: {required: false}
      SHFV_TOKEN: {required: false, description: "Read access to this repo, for a caller while it is private"}

# Read-only token for the checkout of this repo; nothing else (§3.1, §9.3).
permissions:
  contents: read

concurrency:
  group: replay-${{ inputs.case || format('live-{0}-{1}', inputs.target, inputs.head) }}
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ${{ inputs.runner }}
    # Below the 6 h job cap (§9.4), so a slow run still uploads its record.
    timeout-minutes: 345
    env:
      CASE: ${{ inputs.case }}
      # Live input (workflow_call); empty on a dispatched replay. Passed as variables, never pasted
      # into scripts: the title is free text from the target repo.
      TARGET: ${{ inputs.target }}
      BASE_SHA: ${{ inputs.base }}
      HEAD_SHA: ${{ inputs.head }}
      FETCH_REF: ${{ inputs.fetch_ref }}
      PR: ${{ inputs.pr }}
      TITLE: ${{ inputs.title }}
      REPO_OVERRIDE: ${{ inputs.repo }}
      AGENT: ${{ inputs.agent }}
      MODEL: ${{ inputs.model }}
      PER_RUN_USD: ${{ inputs.per_run_usd }}
      PER_RUN_MINUTES: ${{ inputs.per_run_minutes }}
      CLAUDE_CODE_VERSION: "2.1.311"
      ELAN_TAG: v4.2.4
    steps:
      - name: Check inputs
        run: |
          if [ -n "$TARGET" ]; then
            [[ "$TARGET" =~ ^[a-z0-9-]+$ && "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ \
               && "$PR" =~ ^[0-9]*$ && "$FETCH_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ \
               && ( -z "$REPO_OVERRIDE" || "$REPO_OVERRIDE" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ) ]] || {
              echo "::error::bad live input"; exit 1; }
            case_dir="$TARGET-live-${HEAD_SHA:0:8}"
          else
            [[ "$CASE" =~ ^[a-z0-9-]+/[0-9a-f]{8}$ ]] || { echo "::error::bad case id: $CASE"; exit 1; }
            case_dir="${CASE/\//-}"
          fi
          echo "CASE_DIR=$case_dir" >> "$GITHUB_ENV"
          [[ "$MODEL" =~ ^[a-z0-9.-]*$ ]] || { echo "::error::bad model: $MODEL"; exit 1; }
          [[ "$PER_RUN_USD" =~ ^[0-9]+(\.[0-9]+)?$ && "$PER_RUN_MINUTES" =~ ^[0-9]+$ ]] || {
            echo "::error::caps must be numbers"; exit 1; }
          mkdir -p "$RUNNER_TEMP/stats"
          echo "STATS=$RUNNER_TEMP/stats" >> "$GITHUB_ENV"
          # Run records outside this repo's checkout (DESIGN.md §8.5, `shfv doctor`'s location check), and
          # not nested with the work folder ($RUNNER_TEMP/work or /mnt/shfv/work, "Free disk").
          echo "SHFV_RUNS=$RUNNER_TEMP/runs" >> "$GITHUB_ENV"

      # This repo at this workflow's commit, also when another repo's workflow calls it (where the
      # default would be the caller's repo).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository || github.repository }}
          ref: ${{ job.workflow_sha || github.sha }}
          token: ${{ secrets.SHFV_TOKEN || github.token }}
          persist-credentials: false  # the token does not stay in .git/config, where the agent could read it

      - name: Runner before setup
        run: |
          { echo "## Runner"; echo; echo '```'; uname -a; nproc; free -m; df -h / /mnt 2>/dev/null; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

      # Each replay workspace holds a built Mathlib (about 8 GB). On ext4 every copy is a full copy,
      # so free the preinstalled toolchains this job does not use, and work on the larger volume.
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          root_free=$(df --output=avail -B1G / | tail -1)
          mnt_free=$(df --output=avail -B1G /mnt 2>/dev/null | tail -1 || echo 0)
          if [ "${mnt_free:-0}" -gt "$root_free" ]; then
            sudo mkdir -p /mnt/shfv && sudo chown "$USER" /mnt/shfv && work=/mnt/shfv/work
          else
            work="$RUNNER_TEMP/work"
          fi
          mkdir -p "$work"
          echo "SHFV_WORK=$work" >> "$GITHUB_ENV"
          { echo; echo "Work volume: \`$work\` (free: / ${root_free} GB, /mnt ${mnt_free:-0} GB)"; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install elan
        run: |
          curl -sSfL "https://raw.githubusercontent.com/leanprover/elan/$ELAN_TAG/elan-init.sh" -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Install Claude Code
        run: npm install -g --no-fund --no-audit "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"

      # Claude Code scrubs the key from the commands it runs (CLAUDE_CODE_SUBPROCESS_ENV_SCRUB), and on
      # Linux that needs bubblewrap; without it Claude Code exits before its first turn (run 2). Ubuntu
      # 24.04 blocks the unprivileged user namespaces bubblewrap uses (the probe failed on run 2's retry),
      # so allow them on this throwaway VM if the probe fails.
      - name: Install bubblewrap
        if: inputs.agent
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          if ! bwrap --ro-bind / / --unshare-user --unshare-net true; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            bwrap --ro-bind / / --unshare-user --unshare-net true
          fi
          bwrap --version

      # The lean4checker builds that the gate caches per toolchain (G5).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/self-healing-fv
          key: lean4checker-${{ runner.os }}-${{ inputs.case || inputs.target }}-${{ hashFiles('gates/kernel.py') }}
          restore-keys: lean4checker-${{ runner.os }}-

      # Full history: the replay takes the base, change and fix commits from it.
      # Live: the head is fetched by `fetch_ref` (refs/pull/<n>/head also serves PRs from forks), and
      # the base is its merge-base with `base`, as `shfv repair --base --head` computes it.
      - name: Clone the target repo
        id: clone
        env:
          # For a private copy (pr-repair.yml from it): passed per command, never written to .git/config.
          GIT_TOKEN: ${{ inputs.repo != '' && github.token || '' }}
        run: |
          name="${TARGET:-${CASE%%/*}}"
          read -r repo root < <(python3 -c 'import sys, tomllib; c = tomllib.load(open(sys.argv[1], "rb"))
          print(c["github"], c["lean"].get("repo_lean_root", "") or ".")' "targets/$name.toml")
          clone="$HOME/baif/${repo##*/}"
          repo="${REPO_OVERRIDE:-$repo}"
          auth=()
          [ -z "$GIT_TOKEN" ] || auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 -w0)")
          git "${auth[@]}" clone --quiet "https://github.com/$repo" "$clone"
          git -C "$clone" log -1 --format='%h %cs %s'
          if [ -n "$TARGET" ]; then
            git "${auth[@]}" -C "$clone" fetch --quiet origin "$FETCH_REF"
            git -C "$clone" cat-file -e "$HEAD_SHA^{commit}" || { echo "::error::$FETCH_REF did not bring $HEAD_SHA"; exit 1; }
            base=$(git -C "$clone" merge-base "$BASE_SHA" "$HEAD_SHA"); change="$HEAD_SHA"
            { echo "## Live input"; echo; echo "\`$repo\` ${PR:+PR $PR }head \`${HEAD_SHA:0:8}\`, merge-base \`${base:0:8}\`"; } \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
          read -r base change < <(python3 - "data/mined/${CASE%%/*}.jsonl" "${CASE#*/}" <<'EOF'
          import json, sys
          for line in open(sys.argv[1]):
              r = json.loads(line)
              if r["change_commit"].startswith(sys.argv[2]):
                  print(r["base_commit"], r["change_commit"]); break
          EOF
          )
          fi
          toolchain=$(git -C "$clone" show "$change:$root/lean-toolchain" 2>/dev/null || echo leanprover/lean4:stable)
          base_toolchain=$(git -C "$clone" show "$base:$root/lean-toolchain" 2>/dev/null || true)
          # The replay store's cache key: the case's toolchains and Lake manifests (base and change).
          pins=$(for c in "$base" "$change"; do for f in lean-toolchain lake-manifest.json; do
            git -C "$clone" show "$c:$root/$f" 2>/dev/null; done; done | sha256sum | cut -c1-16)
          { echo "repo=$name"; echo "pins=$pins"; echo "base=$base"; echo "change=$change"; echo "root=$root"
            echo "clone=$clone"; echo "toolchain=$toolchain"; echo "base_toolchain=$base_toolchain"; } >> "$GITHUB_OUTPUT"

      # The change commit's toolchain becomes the default (for `shfv doctor`; the replay needs it anyway),
      # and the base commit's is installed too if it differs. elan would otherwise download each one on
      # first use, inside a later step, where a failed download shows up as an unrelated error (issue 38).
      # Here a failure stops the job in this step, with elan's own output and after retries.
      - name: Install the Lean toolchain
        env:
          TOOLCHAIN: ${{ steps.clone.outputs.toolchain }}
          BASE_TOOLCHAIN: ${{ steps.clone.outputs.base_toolchain }}
        run: |
          tcs=("$TOOLCHAIN")
          [ -z "$BASE_TOOLCHAIN" ] || [ "$BASE_TOOLCHAIN" = "$TOOLCHAIN" ] || tcs+=("$BASE_TOOLCHAIN")
          .github/scripts/install_toolchain.sh "${tcs[@]}"
          elan default "$TOOLCHAIN"
          lake --version

      # The replay store (replay/replay_case.py `Store`): built Lake packages (Mathlib, Aeneas, ...) by
      # revision, and the project's .lake/build by commit, which seed each state's build. Lake re-checks
      # hashes, so a seed from another commit only speeds things up. The steps follow the .lake cache that
      # Lara (Lacramioara Astefanoaei) wrote for secure-messaging's CI: one cache, restored by exact key or
      # by prefix, saved only when there was no exact hit.
      # https://github.com/Beneficial-AI-Foundation/secure-messaging/blob/6ba44239abbca2abba26b145675bb1d766e6591f/.github/workflows/ci.yml#L62-L81
      # Exact hit: the same case again. Prefix hit: another case with the same pins, or the same repo.
      - name: Restore the replay store
        id: store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.SHFV_WORK }}/_store
          key: shfv-store-${{ runner.os }}-${{ steps.clone.outputs.repo }}-${{ steps.clone.outputs.pins }}-${{ steps.clone.outputs.change }}
          restore-keys: |
            shfv-store-${{ runner.os }}-${{ steps.clone.outputs.repo }}-${{ steps.clone.outputs.pins }}-
            shfv-store-${{ runner.os }}-${{ steps.clone.outputs.repo }}-

      - name: Replay store restored
        env:
          HIT: ${{ steps.store.outputs.cache-hit }}
          MATCHED: ${{ steps.store.outputs.cache-matched-key }}
        run: |
          if [ "$HIT" = "true" ]; then what="exact hit"; elif [ -n "$MATCHED" ]; then what="prefix hit: $MATCHED"; else what="miss"; fi
          { echo; echo "Replay store: $what ($(du -sh "$SHFV_WORK/_store" 2>/dev/null | cut -f1 || echo empty))"; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Doctor
        env:
          NAME: ${{ steps.clone.outputs.repo }}
          CLONE: ${{ steps.clone.outputs.clone }}
        run: |
          uv sync --quiet
          uv run shfv doctor --config "targets/$NAME.toml" --repo "$CLONE" --runs "$SHFV_RUNS"

      - name: Start resource sampler
        run: |
          nohup python3 .github/scripts/runner_stats.py sample --out "$STATS/samples.csv" --path "$SHFV_WORK" \
            > "$STATS/sampler.log" 2>&1 &
          echo $! > "$STATS/sampler.pid"

      - name: Replay
        id: replay
        env:
          # The key reaches this step only when the agent is on; shfv hands it to the agent alone.
          ANTHROPIC_API_KEY: ${{ inputs.agent && secrets.ANTHROPIC_API_KEY || '' }}
        run: |
          if [ -n "$TARGET" ]; then
            args=(--target "$TARGET" --base "$BASE_SHA" --head "$HEAD_SHA")
            [ -z "$PR" ] || args+=(--pr "$PR")
            [ -z "$TITLE" ] || args+=(--title "$TITLE")
            [ -z "$REPO_OVERRIDE" ] || args+=(--github "$REPO_OVERRIDE")  # links point at the calling repo
          else
            args=(--case "$CASE")
          fi
          args+=(--per-run-usd "$PER_RUN_USD" --per-run-minutes "$PER_RUN_MINUTES" --label actions --runs "$SHFV_RUNS")
          if [ "$AGENT" = "true" ]; then
            [ -n "$ANTHROPIC_API_KEY" ] || { echo "::error::agent is on but the ANTHROPIC_API_KEY secret is not set"; exit 1; }
            args+=(--auth api-key)
          else
            unset ANTHROPIC_API_KEY
            args+=(--no-agent)
          fi
          [ -z "$MODEL" ] || args+=(--model "$MODEL")
          date +%s > "$STATS/start"
          set -o pipefail
          uv run shfv repair "${args[@]}" 2>&1 | tee "$STATS/shfv.log"

      - name: Resource summary
        if: always()
        run: |
          kill "$(cat "$STATS/sampler.pid" 2>/dev/null)" 2>/dev/null || true
          run_dir=$(readlink -f "$SHFV_RUNS/$CASE_DIR/latest" 2>/dev/null || true)
          echo "RUN_DIR=$run_dir" >> "$GITHUB_ENV"
          # The full report on the run's summary page, one click from the PR comment (its short form).
          # It holds no prompts or transcripts: the same text as report.md in the artifact.
          if [ -n "$run_dir" ] && [ -f "$run_dir/report.md" ]; then
            cat "$run_dir/report.md" >> "$GITHUB_STEP_SUMMARY"
            printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 .github/scripts/runner_stats.py summarize --samples "$STATS/samples.csv" --log "$STATS/shfv.log" \
            --start "$(cat "$STATS/start" 2>/dev/null || date +%s)" ${run_dir:+--report "$run_dir/report.json"} \
            | tee "$STATS/resources.md" >> "$GITHUB_STEP_SUMMARY"
          # The kernel's OOM killer leaves a trace here; a build killed for memory looks like a failure otherwise.
          sudo dmesg -T 2>/dev/null | grep -iE 'out of memory|oom-kill|killed process' > "$STATS/oom.txt" || true
          if [ -s "$STATS/oom.txt" ]; then
            { echo "### OOM kills"; echo '```'; cat "$STATS/oom.txt"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          { echo "### Disk at the end"; echo '```'; df -h / /mnt 2>/dev/null; du -sh "$SHFV_WORK"/* 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$run_dir" ] && [ -f "$run_dir/report.md" ]; then
            { echo; echo "## Report"; echo; cat "$run_dir/report.md"; } >> "$GITHUB_STEP_SUMMARY"
          fi
          mkdir -p "$STATS/replay-logs"
          cp -R "$SHFV_WORK/$CASE_DIR/logs/." "$STATS/replay-logs/" 2>/dev/null || true

      # Keep only what this case uses (its packages and its base and change builds), so entries
      # restored by prefix from other cases do not pile up in the next save (10 GB per repo). Mathlib
      # is left out: 5.5-7 GB per revision unpacked, against 45-97 s per state for its own cache
      # (ACTIONS.md, run 1). The project builds are what save time (ACTIONS.md, "Replay store cache").
      - name: Trim the replay store
        id: trim
        if: ${{ !cancelled() && steps.store.outputs.cache-hit != 'true' && steps.clone.outputs.change != '' }}
        env:
          CLONE: ${{ steps.clone.outputs.clone }}
          ROOT_DIR: ${{ steps.clone.outputs.root }}
          BASE: ${{ steps.clone.outputs.base }}
          CHANGE: ${{ steps.clone.outputs.change }}
        run: |
          keep=$(for c in "$BASE" "$CHANGE"; do git -C "$CLONE" show "$c:$ROOT_DIR/lake-manifest.json" 2>/dev/null \
            | python3 -c 'import json, sys; [print(p["name"] + "@" + p["rev"]) for p in json.load(sys.stdin)["packages"] if p.get("rev")]'; done)
          for d in "$SHFV_WORK"/_store/pkgs/*; do
            if [ -e "$d" ] && { [[ "$(basename "$d")" == mathlib@* ]] || ! grep -qxF "$(basename "$d")" <<< "$keep"; }; then
              rm -rf "$d"
            fi
          done
          for d in "$SHFV_WORK"/_store/builds/*; do
            if [ -e "$d" ] && [ "$(basename "$d")" != "$BASE" ] && [ "$(basename "$d")" != "$CHANGE" ]; then rm -rf "$d"; fi
          done
          { echo "Replay store to save:"; du -sh "$SHFV_WORK"/_store/pkgs/* "$SHFV_WORK"/_store/builds/* 2>/dev/null || true; } \
            | tee "$STATS/store.txt"
          if [ -n "$(find "$SHFV_WORK/_store" -mindepth 2 -maxdepth 2 2>/dev/null | head -1)" ]; then
            echo "nonempty=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save the replay store
        if: ${{ !cancelled() && steps.trim.outputs.nonempty == 'true' && inputs.save_store != false }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.SHFV_WORK }}/_store
          key: ${{ steps.store.outputs.cache-primary-key }}

      # In a target repo (record: reports) only the reports and the patch leave the runner: its
      # artifacts can be public, and the prompts and transcripts stay out of them.
      - name: Reports only
        if: always() && env.RUN_DIR != '' && inputs.record == 'reports'
        run: |
          out="$RUNNER_TEMP/record"
          mkdir -p "$out"
          cp "$RUN_DIR/report.json" "$RUN_DIR/report.md" "$out/" 2>/dev/null || true
          python3 -c 'import json, sys; d = json.load(open(sys.argv[1])).get("delivery_diff")
          d and open(sys.argv[2], "w").write(d)' "$out/report.json" "$out/repair.patch" 2>/dev/null || true
          echo "RUN_DIR=$out" >> "$GITHUB_ENV"

      # Raw model output stays on the runner unless asked for: anyone can download a public repo's
      # artifacts. Dropped: each attempt's transcript.jsonl (Claude Code's or Codex's event stream) and
      # Codex's CODEX_HOME (its session state). Kept: reports, prompts, the bot's suggestion.patch.
      - name: Drop transcripts
        if: always() && env.RUN_DIR != '' && inputs.record != 'reports' && !inputs.upload_transcripts
        run: |
          out="$RUNNER_TEMP/record-no-transcripts"
          rm -rf "$out" && mkdir -p "$out"
          cp -R "$RUN_DIR/." "$out/"
          find "$out" -path '*/attempts/*' \( -name transcript.jsonl -o -name codex-home \) -prune -exec rm -rf {} +
          echo "RUN_DIR=$out" >> "$GITHUB_ENV"

      # The run record (§3.3 S7): report.json, report.md, the agent's prompts and, if asked for, its
      # transcripts. Live, its name (live-<target>-<head8>) is how live.yml knows a head was already run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always() && env.RUN_DIR != ''
        with:
          name: ${{ inputs.artifact || format('run-record-{0}-{1}', github.run_id, github.run_attempt) }}
          path: ${{ env.RUN_DIR }}
          if-no-files-found: warn
          overwrite: true

      # What the runner went through: pipeline output, resource samples, replay build logs.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: runner-stats-${{ inputs.artifact || 'replay' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.STATS }}
          if-no-files-found: warn
